name: Build Vast.ai Wan 2.2 Animate Image

on:
  workflow_dispatch:
  push:
    paths:
      - 'Dockerfile.vast'
      - '.github/workflows/build-vast-image.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean || true
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.vast
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/akarai-wan22-animate:latest
          # Image besar (~40GB) - optimasi cache & network
          provenance: false
          build-args: |
            BUILDKIT_STEP_LOG_MAX_SIZE=10485760
